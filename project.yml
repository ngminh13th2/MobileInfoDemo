name: MobileInfoDemo
options:
  bundleIdPrefix: com.ngminh
  deploymentTarget:
    iOS: "16.0"
targets:
  MobileInfoDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngminh.mobileinfodemo
        PRODUCT_NAME: MobileInfoDemo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
