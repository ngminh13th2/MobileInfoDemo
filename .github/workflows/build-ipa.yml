
name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MobileInfoDemo.xcodeproj \
            -scheme MobileInfoDemo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MobileInfoDemo.app Payload/
          /usr/bin/zip -qry MobileInfoDemo.ipa Payload
          test -s MobileInfoDemo.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileInfoDemo-unsigned-ipa
          path: MobileInfoDemo.ipa
          if-no-files-found: error
          retention-days: 7
